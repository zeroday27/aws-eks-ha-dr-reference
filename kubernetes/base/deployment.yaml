# =============================================================================
# Hotel Platform - Kubernetes Deployment
# High Availability Configuration with Multi-AZ Distribution
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-api
  namespace: hotel
  labels:
    app: hotel-api
    tier: backend
    version: v1
spec:
  replicas: 6  # Minimum for HA across 3 AZs (2 per AZ)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0  # Zero downtime deployments
  selector:
    matchLabels:
      app: hotel-api
  template:
    metadata:
      labels:
        app: hotel-api
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Service Account with IRSA for AWS permissions
      serviceAccountName: hotel-app
      priorityClassName: stateless-api
      
      # Spread pods across all 3 Availability Zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hotel-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hotel-api
      
      # Anti-affinity to prevent pods on same node
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodepool
                    operator: In
                    values:
                      - stateless
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hotel-api
                topologyKey: kubernetes.io/hostname
      
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: hotel-api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/hotel-api:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          # Environment Variables
          env:
            - name: APP_ENV
              value: "${APP_ENV}"
            - name: LOG_LEVEL
              value: "info"
            - name: SERVER_PORT
              value: "8080"
            # Application reads database and redis credentials from mounted
            # Secrets Manager files via CSI (not from environment variables).
            - name: DB_SECRET_FILE
              value: "/mnt/secrets-store/db.json"
            - name: REDIS_SECRET_FILE
              value: "/mnt/secrets-store/redis.json"
          
          # Resource Requests and Limits
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          
          # Readiness Probe - Traffic only routed when ready
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          # Liveness Probe - Restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          # Startup Probe - Allow time for initial startup
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # 150 seconds max startup time
          
          # Container Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Volume Mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
      
      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: hotel-app-secrets
      
      # Termination Grace Period for graceful shutdown
      terminationGracePeriodSeconds: 60
      
      # DNS Policy
      dnsPolicy: ClusterFirst
      tolerations:
        - key: workload-tier
          operator: Equal
          value: stateless
          effect: NoSchedule
---
# =============================================================================
# Service Account with IRSA Annotation
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotel-app
  namespace: hotel
  annotations:
    eks.amazonaws.com/role-arn: ${WORKLOAD_IRSA_ROLE_ARN}
---
# =============================================================================
# Namespace
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: hotel
  labels:
    name: hotel
