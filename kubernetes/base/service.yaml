# =============================================================================
# Service - Internal Cluster Access
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: hotel-api
  namespace: hotel
  labels:
    app: hotel-api
spec:
  type: ClusterIP
  selector:
    app: hotel-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
# =============================================================================
# Service - Internal NLB for API Gateway VPC Link
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: hotel-api-private-nlb
  namespace: hotel
  labels:
    app: hotel-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-name: "hotel-api-private"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health/ready"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "traffic-port"
spec:
  type: LoadBalancer
  selector:
    app: hotel-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
