# =============================================================================
# Karpenter NodePools - EKS-only Platform Segmentation
# =============================================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: hotel-critical
spec:
  template:
    metadata:
      labels:
        app: hotel
        nodepool: critical
        workload-tier: critical
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ${PRIMARY_AZ_1}
            - ${PRIMARY_AZ_2}
            - ${PRIMARY_AZ_3}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: hotel-default
      taints:
        - key: workload-tier
          value: critical
          effect: NoSchedule

  limits:
    cpu: 800
    memory: 1600Gi

  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30m
    budgets:
      - nodes: "10%"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: hotel-stateless
spec:
  template:
    metadata:
      labels:
        app: hotel
        nodepool: stateless
        workload-tier: stateless
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ${PRIMARY_AZ_1}
            - ${PRIMARY_AZ_2}
            - ${PRIMARY_AZ_3}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: hotel-default
      taints:
        - key: workload-tier
          value: stateless
          effect: NoSchedule

  limits:
    cpu: 600
    memory: 1200Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: hotel-default
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${KARPENTER_DISCOVERY_TAG}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${KARPENTER_DISCOVERY_TAG}

  role: ${KARPENTER_NODE_ROLE_NAME}

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: HotelPlatform
    Environment: ${APP_ENV}
    ManagedBy: Karpenter
