# =============================================================================
# Karpenter NodePools - EKS-only Platform Segmentation
# =============================================================================

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: hotel-critical
spec:
  template:
    metadata:
      labels:
        app: hotel
        nodepool: critical
        workload-tier: critical
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-southeast-1a
            - ap-southeast-1b
            - ap-southeast-1c
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: hotel-default
      taints:
        - key: workload-tier
          value: critical
          effect: NoSchedule

  limits:
    cpu: 800
    memory: 1600Gi

  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30m
    budgets:
      - nodes: "10%"
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: hotel-stateless
spec:
  template:
    metadata:
      labels:
        app: hotel
        nodepool: stateless
        workload-tier: stateless
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-southeast-1a
            - ap-southeast-1b
            - ap-southeast-1c
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: hotel-default
      taints:
        - key: workload-tier
          value: stateless
          effect: NoSchedule

  limits:
    cpu: 600
    memory: 1200Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: hotel-default
spec:
  amiFamily: AL2023

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: hotel-prod

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: hotel-prod

  instanceProfile: hotel-prod-karpenter-node-profile

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: HotelPlatform
    Environment: prod
    ManagedBy: Karpenter
