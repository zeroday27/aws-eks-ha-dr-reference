# =============================================================================
# Network Policies - Hotel Namespace
# Default deny + allow rules for inter-service communication
# =============================================================================

# Default deny all ingress traffic in hotel namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hotel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow hotel-api to receive traffic from any pod in hotel namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hotel-api-ingress
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      app: hotel-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: hotel
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
---
# Allow critical domain services to communicate with each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-critical-services
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      workload-tier: critical
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              workload-tier: critical
        - podSelector:
            matchLabels:
              workload-tier: stateless
      ports:
        - protocol: TCP
          port: 8080
---
# Allow stateless services to receive traffic from hotel-api NLB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stateless-ingress
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      workload-tier: stateless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: hotel
      ports:
        - protocol: TCP
          port: 8080
---
# Allow Prometheus to scrape metrics from all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: hotel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
