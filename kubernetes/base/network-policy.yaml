# =============================================================================
# Network Policies - Hotel Namespace
# Default deny + allow rules for inter-service communication
# =============================================================================

# Default deny all ingress and egress traffic in hotel namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hotel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS and private VPC egress for AWS VPC endpoints, RDS, Redis, and internal services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-egress
  namespace: hotel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: ${VPC_CIDR}
---
# Allow hotel-api to receive traffic from hotel namespace pods and private VPC ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hotel-api-ingress
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      app: hotel-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: hotel
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
---
# Allow critical domain services to communicate with each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-critical-services
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      workload-tier: critical
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              workload-tier: critical
        - podSelector:
            matchLabels:
              workload-tier: stateless
      ports:
        - protocol: TCP
          port: 8080
---
# Allow stateless services to receive traffic from hotel-api NLB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stateless-ingress
  namespace: hotel
spec:
  podSelector:
    matchLabels:
      workload-tier: stateless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: hotel
      ports:
        - protocol: TCP
          port: 8080
---
# Allow Prometheus to scrape metrics from all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: hotel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
