# =============================================================================
# AWS Secrets Manager CSI integration
# Mounts secrets as files (no credential env vars, no plaintext in manifests).
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hotel-app-secrets
  namespace: hotel
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${DB_SECRET_ARN}"
        objectType: "secretsmanager"
        objectAlias: "db.json"
      - objectName: "${REDIS_SECRET_ARN}"
        objectType: "secretsmanager"
        objectAlias: "redis.json"
