# =============================================================================
# EKS Workload Placement
# This file codifies that all containerized services run on EKS.
# Critical domain services are isolated from stateless API services via
# PriorityClasses, Karpenter NodePools, and taints/tolerations.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-core
  namespace: hotel
  labels:
    app: hotel-core
    workload-tier: critical
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hotel-core
  template:
    metadata:
      labels:
        app: hotel-core
        workload-tier: critical
    spec:
      serviceAccountName: hotel-app
      priorityClassName: critical-domain
      tolerations:
        - key: workload-tier
          operator: Equal
          value: critical
          effect: NoSchedule
      nodeSelector:
        nodepool: critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/hotel-core:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
