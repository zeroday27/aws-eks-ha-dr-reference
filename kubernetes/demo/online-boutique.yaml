# =============================================================================
# Online Boutique Demo — Adapted for Hotel HA/DR Architecture
# Uses public Google Artifact Registry images (no ECR mirror needed for POC)
#
# Service Mapping:
#   checkoutservice       → hotel-core (critical)
#   cartservice           → loyalty-account (critical, uses Redis)
#   productcatalogservice → inventory-availability (critical)
#   currencyservice       → pricing-rules-engine (critical)
#   paymentservice        → reservation-orchestrator (critical)
#   frontend              → public-api-bff (stateless)
#   recommendationservice → search-api (stateless)
#   shippingservice       → hotel-content-api (stateless)
#   emailservice          → session-api (stateless)
#   adservice             → admin-ops-api (stateless)
#   loadgenerator         → load-generator (utility)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: hotel
  labels:
    name: hotel
---
# --- Service Accounts ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotel-demo
  namespace: hotel
---
# =============================================================================
# CRITICAL TIER — On-Demand Karpenter NodePool (hotel-critical)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-core
  namespace: hotel
  labels:
    app: hotel-core
    workload-tier: critical
    demo-maps-to: checkoutservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-core
  template:
    metadata:
      labels:
        app: hotel-core
        workload-tier: critical
    spec:
      serviceAccountName: hotel-demo
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      tolerations:
        - key: workload-tier
          operator: Equal
          value: critical
          effect: NoSchedule
      nodeSelector:
        nodepool: critical
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/checkoutservice:v0.10.5
          ports:
            - containerPort: 5050
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
            - name: PORT
              value: "5050"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "inventory-availability:3550"
            - name: SHIPPING_SERVICE_ADDR
              value: "hotel-content-api:50051"
            - name: PAYMENT_SERVICE_ADDR
              value: "reservation-orchestrator:50051"
            - name: EMAIL_SERVICE_ADDR
              value: "session-api:5000"
            - name: CURRENCY_SERVICE_ADDR
              value: "pricing-rules-engine:7000"
            - name: CART_SERVICE_ADDR
              value: "loyalty-account:7070"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-core
  namespace: hotel
spec:
  type: ClusterIP
  selector:
    app: hotel-core
  ports:
    - name: grpc
      port: 5050
      targetPort: 5050
---
