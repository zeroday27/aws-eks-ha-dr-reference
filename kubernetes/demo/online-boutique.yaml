# =============================================================================
# STATELESS TIER — Karpenter NodePool (hotel-stateless)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api-bff
  namespace: hotel
  labels:
    app: public-api-bff
    workload-tier: stateless
    demo-maps-to: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-api-bff
  template:
    metadata:
      labels:
        app: public-api-bff
        workload-tier: stateless
    spec:
      serviceAccountName: hotel-demo
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      tolerations:
        - key: workload-tier
          operator: Equal
          value: stateless
          effect: NoSchedule
      nodeSelector:
        nodepool: stateless
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.5
          ports:
            - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - name: "Cookie"
                  value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - name: "Cookie"
                  value: "shop_session-id=x-liveness-probe"
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "inventory-availability:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "pricing-rules-engine:7000"
            - name: CART_SERVICE_ADDR
              value: "loyalty-account:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "search-api:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "hotel-content-api:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "hotel-core:5050"
            - name: AD_SERVICE_ADDR
              value: "admin-ops-api:9555"
            - name: ENABLE_PROFILER
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
